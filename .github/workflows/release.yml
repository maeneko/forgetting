name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: awg-ui
        run: |
          npm install
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Архив на архитектуру: Go-бинарник awg-control + собранный фронтенд + .env.
      - name: Package archives
        run: sh tools/release/package.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" awgcontrol-"${VERSION}"-linux-*.tar.gz \
            --title "${GITHUB_REF_NAME}" --generate-notes --prerelease
